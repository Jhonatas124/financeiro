<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Financeiro">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0A0C">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Financeiro de Bolso</title>
<style>
:root{
  --bg:#0A0A0C; --surface:#151518; --surface-2:#1E1E23; --surface-3:#26262D; --ink:#F4F4F6; --muted:#8E8E99; --dim:#5F5F69;
  --line:#25252B; --line-strong:#34343C;
  --lime:#C6F36B; --lime-ink:#0A0A0C; --lime-soft:rgba(198,243,107,.12);
  --lav:#B7B4FF; --lav-ink:#14132B; --lav-soft:rgba(183,180,255,.13);
  --purple:#7B5CFF;
  --coral:#FF7A66; --coral-soft:rgba(255,122,102,.13);
  --sun:#F4E46A; --sun-soft:rgba(244,228,106,.12);
  --s-in:#72A02A; --s-out:#8C82E6;   /* séries validadas p/ gráfico (entrou × saiu) */
  --scrim:rgba(0,0,0,.62);
  --radius:22px; --radius-s:16px; --tabbar:66px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:340px;pointer-events:none;z-index:0;
  background:radial-gradient(120% 90% at 50% -10%,rgba(123,92,255,.34),rgba(123,92,255,.08) 55%,transparent 75%)}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
[hidden]{display:none!important}
.vh{position:absolute!important;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:13px} .tiny{font-size:12px} .center{text-align:center}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--lime)} .neg{color:var(--ink)} .neu{color:var(--muted)} .warn{color:var(--sun)} .bad{color:var(--coral)}

main{position:relative;z-index:1;max-width:560px;margin:0 auto;
  padding-top:calc(env(safe-area-inset-top, 0px) + 12px);
  padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 34px);
  padding-left:16px;padding-right:16px;display:flex;flex-direction:column;gap:16px}

h1{font-size:26px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.02em}
h2{font-size:18px;line-height:1.2;margin:0;font-weight:650;letter-spacing:-.01em}
h3{font-size:15px;margin:0;font-weight:650}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:6px}
.sec-head .linkish{font-size:14px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px}
.page-head.center-title{display:grid;grid-template-columns:44px 1fr 44px}
.page-head.center-title h1{text-align:center;font-size:20px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* botões */
.btn{appearance:none;border:0;font-weight:650;font-size:16px;border-radius:999px;padding:12px 18px;min-height:48px;
  background:var(--surface-2);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;line-height:1.2}
.btn.primary{background:var(--lime);color:var(--lime-ink)}
.btn.lav{background:var(--lav);color:var(--lav-ink)}
.btn.danger{background:transparent;color:var(--coral);border:1px solid rgba(255,122,102,.4)}
.btn.ghost{background:transparent;color:var(--lime);padding-left:6px;padding-right:6px}
.btn.block{width:100%}
.btn.small{min-height:40px;padding:8px 14px;font-size:15px}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.icon-btn:focus-visible,.row-btn:focus-visible,.pill:focus-visible,.qa button:focus-visible,.tabbar button:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.icon-btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none;position:relative}
.icon-btn.plain{border:0;background:transparent}
.icon-btn:disabled{opacity:.3}
.icon-btn .badge-n{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--coral);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.linkish{appearance:none;border:0;background:none;padding:0;color:var(--lime);font-weight:600;text-align:left;cursor:pointer}

/* superfícies */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card.tight{padding:12px 14px}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.list>li+li{border-top:1px solid var(--line)}
.row-btn{appearance:none;border:0;background:transparent;width:100%;text-align:left;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;min-height:60px;color:inherit}
.rb-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rb-main b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb-main span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb-side{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none;text-align:right}
.rb-side b{font-weight:650;font-variant-numeric:tabular-nums}
.empty{padding:22px 18px;text-align:center;border:1.5px dashed var(--line-strong);border-radius:var(--radius);color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--ink);font-weight:700;font-size:14px}

/* pílulas (filtros) */
.pills{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{appearance:none;flex:none;border:0;background:var(--surface-2);color:var(--ink);border-radius:999px;padding:10px 16px;font-weight:600;font-size:15px;cursor:pointer;white-space:nowrap;min-height:42px}
.pill[aria-pressed="true"]{background:var(--lime);color:var(--lime-ink)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);max-width:100%;line-height:1.3;white-space:nowrap}
.chip>span{overflow:hidden;text-overflow:ellipsis}
.chip.ok{background:var(--lime-soft);color:var(--lime)} .chip.bad{background:var(--coral-soft);color:var(--coral)} .chip.warn{background:var(--sun-soft);color:var(--sun)} .chip.lav{background:var(--lav-soft);color:var(--lav)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}

/* navegação de mês */
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav h2{flex:1;text-align:center;font-size:17px}

/* herói */
.hero{display:flex;flex-direction:column;gap:4px}
.hero .lbl{font-size:14px;color:var(--muted)}
.money-big{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
.money-big .cur{font-size:22px;font-weight:600;margin-right:4px;color:var(--muted)}
.money-big .cents{color:var(--dim);font-weight:600}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer;color:inherit;min-width:0}
.kpi .k-ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.kpi.in .k-ico{background:var(--lime);color:var(--lime-ink)} .kpi.out .k-ico{background:var(--lav);color:var(--lav-ink)}
.kpi b{font-size:21px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b .cents{color:var(--dim);font-weight:600;font-size:15px}
.kpi b .cur{font-size:14px;color:var(--muted);margin-right:3px;font-weight:600}
.delta-bar{appearance:none;border:0;width:100%;border-radius:var(--radius-s);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;cursor:pointer;
  background:linear-gradient(100deg,#C9C6FF,#9F98F7);color:var(--lav-ink)}
.delta-bar.good{background:linear-gradient(100deg,#D8F7A0,#B3E860);color:var(--lime-ink)}
.delta-bar b{font-size:20px;font-weight:750}
.delta-bar span{font-size:13px;font-weight:550;opacity:.85}

/* ações rápidas */
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa button{appearance:none;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;color:var(--ink);font-size:12.5px;font-weight:550;padding:0;min-width:0}
.qa .qa-ico{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line-strong)}
.qa button:first-child .qa-ico{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}

/* contas fixas */
.fx-sum{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--lime)}
.bar.lav i{background:var(--lav)}
.st-ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.st-ico.paga{background:var(--lime-soft);color:var(--lime)} .st-ico.atrasada{background:var(--coral-soft);color:var(--coral)}
.st-ico.logo{background:var(--sun-soft);color:var(--sun)} .st-ico.apagar{background:var(--surface-2);color:var(--muted)}

/* alertas */
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{appearance:none;border:0;width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;border-radius:var(--radius-s);background:var(--surface);border:1px solid var(--line);cursor:pointer;color:inherit}
.alert .a-ico{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none}
.alert.bad .a-ico{background:var(--coral-soft);color:var(--coral)} .alert.warn .a-ico{background:var(--sun-soft);color:var(--sun)} .alert.info .a-ico{background:var(--lav-soft);color:var(--lav)}
.alert .a-txt{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:14.5px}
.alert .a-txt b{font-weight:650}

/* rosca */
.donut-card{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.donut{width:168px;height:168px;display:block;overflow:visible;margin:4px auto 0}
.donut .seg{fill:none;stroke-linecap:round;cursor:pointer;transition:opacity .15s}
.donut.hl .seg{opacity:.28} .donut.hl .seg.on{opacity:1}
.donut text{fill:var(--ink);font-variant-numeric:tabular-nums}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;min-width:0}
.legend button{appearance:none;border:0;background:transparent;width:100%;display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;padding:7px 2px;cursor:pointer;color:inherit;text-align:left;font-size:14.5px;min-height:40px;border-top:1px solid var(--line)}
.legend li:first-child button{border-top:0}
.legend button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend button b{font-weight:600;font-variant-numeric:tabular-nums}
.legend button small{color:var(--muted);font-weight:500;margin-left:6px;display:inline-block;min-width:34px;text-align:right}
.legend button[aria-pressed="true"] span{color:var(--lime)}


/* gráfico de linha */
.chart{width:100%;height:auto;display:block;overflow:visible;touch-action:pan-y}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:11px}
.chart .axis.cur{fill:var(--lime);font-weight:700}
.chart .l-in{fill:none;stroke:var(--s-in);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chart .l-out{fill:none;stroke:var(--s-out);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chart .guide{stroke:var(--line-strong);stroke-width:1;stroke-dasharray:3 3}
.chart .pt-in{fill:var(--s-in);stroke:var(--surface);stroke-width:2.5}
.chart .pt-out{fill:var(--s-out);stroke:var(--surface);stroke-width:2.5}
.chart-legend{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.chart-legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.chart-tip{font-size:13.5px;min-height:20px;display:flex;gap:12px;flex-wrap:wrap}
.hbar{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:14px}
.hbar .bar{grid-column:1/-1;height:7px}
.hbar b{font-variant-numeric:tabular-nums;font-weight:600}

/* extrato */
.day-h{font-size:13px;color:var(--muted);font-weight:600;margin:6px 4px -4px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px;min-height:48px}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;outline:none;color:var(--ink);padding:10px 0}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tot-line{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted)}

/* cartões */
.cc{border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line-strong);
  background:radial-gradient(120% 140% at 100% 0%,rgba(123,92,255,.35),transparent 55%),linear-gradient(160deg,#1E1E26,#121216)}
.cc.roxo{background:radial-gradient(120% 140% at 100% 0%,rgba(160,80,255,.45),transparent 55%),linear-gradient(160deg,#241532,#121216)}
.cc.preto{background:radial-gradient(120% 140% at 100% 0%,rgba(198,243,107,.18),transparent 55%),linear-gradient(160deg,#1C1C1E,#0E0E10)}
.cc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cc-num{font-size:15px;letter-spacing:.12em;color:var(--muted);font-variant-numeric:tabular-nums}
.cc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.cc-grid div{display:flex;flex-direction:column;gap:1px;min-width:0}
.cc-grid b{font-variant-numeric:tabular-nums;font-size:16px}
.proj{display:flex;align-items:flex-end;gap:6px;height:90px;padding-top:6px}
.proj div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;height:100%;justify-content:flex-end}
.proj i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--lav);min-height:3px}
.proj span{font-size:10.5px;color:var(--muted)}

/* pendências */
.cov{display:flex;flex-direction:column;gap:10px}
.cov-row{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center}
.cov-row .nm{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cov-cells{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:2px}
.cov-cells i{display:block;height:16px;border-radius:3px;background:var(--surface-3)}
.cov-cells i.tem{background:var(--lime)} .cov-cells i.parcial{background:var(--sun)} .cov-cells i.falta{background:var(--coral)} .cov-cells i.zerada{background:#5d7a2a} .cov-cells i.nao_existia{background:transparent;border:1px dashed var(--line-strong)}
.cov-years{display:grid;grid-template-columns:96px 1fr;gap:8px;font-size:11px;color:var(--muted)}
.cov-leg{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.cov-leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* formulários */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span,.section-label{font-size:13px;color:var(--muted);font-weight:600}
.section-label{margin-top:6px;text-transform:uppercase;letter-spacing:.07em;font-size:11.5px}
.input{appearance:none;-webkit-appearance:none;width:100%;min-width:0;font-size:17px;padding:11px 14px;border-radius:14px;border:1px solid var(--line-strong);background:var(--bg);color:var(--ink);min-height:48px}
textarea.input{resize:vertical;line-height:1.35}
.input:focus{outline:2px solid var(--lime);outline-offset:-1px}
input[type="date"].input{display:block}
select.input{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.money-in{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:6px 0 2px}
.money-in b{font-size:22px;color:var(--muted)}
.money-in input{appearance:none;border:0;background:transparent;font-size:46px;font-weight:700;letter-spacing:-.03em;width:6.5ch;text-align:center;color:var(--ink);font-variant-numeric:tabular-nums;padding:0;border-bottom:2px solid var(--line-strong);border-radius:0}
.money-in input:focus{outline:none;border-bottom-color:var(--lime)}
.cat-grid{display:flex;flex-wrap:wrap;gap:6px}
.cat-grid button{appearance:none;border:1px solid var(--line-strong);background:var(--surface-2);border-radius:999px;padding:8px 12px 8px 10px;display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink);min-height:40px}
.cat-grid button[aria-pressed="true"]{border-color:var(--lime);background:var(--lime-soft);color:var(--lime)}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:2px}
.seg button{flex:1;appearance:none;border:0;background:transparent;border-radius:999px;padding:8px 6px;font-size:14.5px;font-weight:600;color:var(--muted);cursor:pointer;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--lime);color:var(--lime-ink)}
.err{color:var(--coral);font-weight:600;margin:0;font-size:14px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0;font-size:15px}
.dl dt{color:var(--muted)} .dl dd{margin:0;font-weight:550;min-width:0;overflow-wrap:anywhere;text-align:right}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;font-size:15px}
.set-row+.set-row{border-top:1px solid var(--line)}
.switch{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:99px;background:var(--line-strong);position:relative;cursor:pointer;flex:none;transition:background .15s;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .15s}
.switch:checked{background:var(--lime)}
.switch:checked::after{transform:translateX(20px)}
.tip-box{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--radius-s);background:var(--lav-soft);color:var(--ink);font-size:14.5px}
.tip-box>svg{color:var(--lav);flex:none;margin-top:2px}
.verdict{border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:6px}
.verdict.ok{background:var(--lime);color:var(--lime-ink)} .verdict.no{background:var(--coral-soft);color:var(--ink);border:1px solid rgba(255,122,102,.35)} .verdict.wait{background:var(--sun-soft);color:var(--ink);border:1px solid rgba(244,228,106,.3)}
.verdict b{font-size:22px;letter-spacing:-.01em}

/* barra de abas flutuante */
.tabbar{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom, 0px));z-index:20;max-width:536px;margin:0 auto;
  background:rgba(24,24,28,.82);-webkit-backdrop-filter:saturate(1.6) blur(20px);backdrop-filter:saturate(1.6) blur(20px);
  border:1px solid var(--line-strong);border-radius:999px;padding:6px}

function smooth(pts, ymin = -1e9, ymax = 1e9) {

/* ---------- DESEJOS ---------- */
function livreAgora() {
  const contas = contasDoEscopo('pessoal'), saldo = contas.reduce((s, c) => s + (saldoConta(c) || 0), 0);
  const datas = contas.filter(c => c.saldo).map(c => c.saldo.d).sort();
  const mk = curMonth();
  const fixasPend = fixasDoEscopo('pessoal').filter(f => { const st = fixaStatus(f, mk); const cc = CONTA[f.forma]; return !['paga', 'skip'].includes(st.status) && !(cc && cc.tipo === 'cartao'); }).reduce((s, f) => s + fixaValor(f), 0);
  let faturas = 0;
  for (const c of S.contas.filter(c => c.tipo === 'cartao' && c.escopo === 'pessoal' && c.ativo !== false)) { const i = cardInfo(c); if (i.last && !i.paga && i.last.vencimento >= today()) faturas += i.last.total; faturas += Math.max(0, i.aberta); }
  return { saldo, fixasPend, faturas, livre: saldo - fixasPend - faturas, desde: datas[0] || null };
}
function veredito(d) {
  const L = livreAgora(), espera = S.settings.esperaDias || 0, dias = daysBetween(d.criado.slice(0, 10), today()), falta = espera - dias;
  const mkIn = monthFlows(curMonth(), 'pessoal').tin;
  let v;
  if (falta > 0) v = { k: 'wait', t: `Espere mais ${plural(falta, 'dia', 'dias')}`, s: `Libera em ${fmtDK(addDays(d.criado.slice(0, 10), espera))}. Se ainda quiser, compra.` };
  else if (d.preco <= L.livre) v = { k: 'ok', t: 'Pode comprar', s: `Sobra ${fmtR(L.livre - d.preco)} depois de pagar as contas fixas e as faturas.` };
  else v = { k: 'no', t: 'Não cabe agora', s: `Faltam ${fmtR(d.preco - Math.max(0, L.livre))}. Só daria mexendo na reserva — e a regra é não mexer.` };
  return { ...v, L, dias, mkIn };
}

const COB_INI = '2024-01';
function coberturaMapa() {
  const months = []; for (let m = COB_INI; m <= curMonth(); m = addMonths(m, 1)) months.push(m);
  const base = {}; for (const c of S.cobertura) base[c.conta + '|' + c.mes] = c.status;
  const rows = [];
  for (const c of S.contas.filter(c => c.ativo !== false)) {
    const cells = months.map(m => {
      let st = base[c.id + '|' + m] || 'falta';
      if (st !== 'tem' && st !== 'nao_existia') {
        const ini = m + '-01', fim = m + '-' + pad(daysInMonth(m)), lim = fim > today() ? addDays(today(), -2) : fim;

function coberturaFaltando() {

async function shareOrDownload(file, title) {
  if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title }); return true; } catch (e) { if (e.name === 'AbortError') return false; } }
  const u = URL.createObjectURL(file); const a = document.createElement('a'); a.href = u; a.download = file.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 5000); return true;
}
async function exportCsv(list) {
  const q = v => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const head = 'data;conta;banco;final;descricao;categoria;tipo;escopo;valor;fatura;parcela;nota';
  const rows = list.map(l => { const c = CONTA[l.c] || {}; return [fmtDK(l.d), c.nome || l.c, c.banco || '', c.final || '', titleOf(l), l.cat, l.t, l.e, NF.format(l.v).replace(/\./g, ''), l.f || '', l.p || '', l.nota || ''].map(q).join(';'); });
  await shareOrDownload(new File(['﻿' + [head, ...rows].join('\n') + '\n'], `lancamentos-${today()}.csv`, { type: 'text/csv' }), 'Lançamentos');
}
function icsText() {
  const now = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  const dias = S.settings.alertaDias || 3;
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Financeiro de Bolso//PT-BR', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:Contas fixas'];
  for (const f of S.fixas.filter(f => f.ativa !== false)) {
    let mk = curMonth(); let due = dueOf(f, mk); if (due < today()) due = dueOf(f, addMonths(mk, 1));
    const ds = due.replace(/-/g, ''), dia = Math.min(f.dia, 28);
    const val = f.valor ? ` (${fmtR(f.valor)})` : '';
    L.push('BEGIN:VEVENT', `UID:fixa-${f.id}@financeiro-de-bolso`, `DTSTAMP:${now}`, `DTSTART;VALUE=DATE:${ds}`, `RRULE:FREQ=MONTHLY;BYMONTHDAY=${dia}`, `SUMMARY:Vence: ${f.nome}${val}`,
      `DESCRIPTION:Conta fixa ${f.e}. Abra o Financeiro de Bolso pra conferir.`, 'TRANSP:TRANSPARENT',
      'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${f.nome} vence em ${dias} dias`, `TRIGGER:-P${dias - 1}DT15H`, 'END:VALARM',
      'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${f.nome} vence hoje`, 'TRIGGER:PT9H', 'END:VALARM', 'END:VEVENT');
  }
  L.push('END:VCALENDAR');
  return L.map(l => l.length > 74 ? l.match(/.{1,73}/g).join('\r\n ') : l).join('\r\n') + '\r\n';
}
async function exportIcs() { await shareOrDownload(new File([icsText()], 'contas-fixas.ics', { type: 'text/calendar' }), 'Contas fixas'); }
async function enableNotif() {
  if (!('Notification' in window)) return toast('Aqui o app não pode mandar aviso. Use "Lembretes no Calendário".', 4200);
  const p = await Notification.requestPermission();
  if (p === 'granted') { toast('Avisos ligados'); notifyDue(true); } else toast('Avisos não liberados. Use os lembretes do Calendário.', 3600);
  render();
}
async function notifyDue(force) {
  if (PREVIEW || !('Notification' in window) || Notification.permission !== 'granted') return;
  let sent = {}; try { sent = (await Store.get('notified')) || {}; } catch (_) {}
  const reg = 'serviceWorker' in navigator ? await navigator.serviceWorker.getRegistration() : null;
  for (const f of S.fixas.filter(f => f.ativa !== false)) {
    const st = fixaStatus(f); if (st.status !== 'logo' && st.status !== 'atrasada') continue;
    const k = f.id + ':' + st.due; if (!force && sent[k] === today()) continue;
    const title = st.status === 'atrasada' ? `${f.nome} está atrasada` : st.dias === 0 ? `${f.nome} vence hoje` : `${f.nome} vence em ${plural(st.dias, 'dia', 'dias')}`;
    const body = `${fmtDK(st.due)}${fixaValor(f) ? ' · ' + fmtR(fixaValor(f)) : ''}`;
    try { if (reg) await reg.showNotification(title, { body, tag: k, icon: 'icon-192.png', badge: 'icon-192.png' }); else new Notification(title, { body, tag: k }); } catch (_) {}
    sent[k] = today();
  }
  try { await Store.put('notified', sent); } catch (_) {}
}

    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' }); if (!r.ok) throw new Error('http ' + r.status);

    if (isNewer(j.version, APP_VERSION)) { Upd.info = j; render(); if (manual) toast(`Versão ${esc(j.version)} disponível`); }
    else { Upd.info = null; if (manual) toast(`Você já está na versão mais nova (${APP_VERSION})`); }
  } catch (_) { if (manual) toast('Não consegui verificar agora.'); }
}
async function applyUpdate() {
  if (Upd.busy) return; Upd.busy = true; toast('Atualizando…', 6000);
  try { if ('serviceWorker' in navigator) { const reg = await navigator.serviceWorker.getRegistration(); if (reg) { try { await reg.update(); } catch (_) {} if (reg.waiting) reg.waiting.postMessage('skip'); } } if (window.caches) { for (const k of await caches.keys()) await caches.delete(k); } } catch (_) {}
  location.reload();
}
const updBanner = () => Upd.info ? `<button class="banner" data-act="app-update">${ico('refresh', 18)}<p><b>Nova versão ${esc(Upd.info.version)} do app.</b> ${Upd.info.notes ? esc(Upd.info.notes) + ' ' : ''}Toque pra atualizar (seus dados não mudam).</p></button>` : '';
</script>
<script>
/* ---------- ações ---------- */
const actions = {
  'tab': el => { UI.tab = el.dataset.tab; UI.page = ''; render(); window.scrollTo(0, 0); },
  'tab-go': el => { closeSheet(); UI.tab = el.dataset.id; UI.page = ''; render(); window.scrollTo(0, 0); },
  'go-page': el => { closeSheet(); UI.tab = 'mais'; UI.page = el.dataset.page ?? el.dataset.id ?? ''; render(); window.scrollTo(0, 0); },
  'close-sheet': () => closeSheet(),
  'scope': el => { UI.scope = el.dataset.v; UI.hl = {}; render(); },
  'fix-scope': el => { UI.fixScope = el.dataset.v; render(); },
  'mes': el => { const n = addMonths(UI.mes, +el.dataset.d); if (n <= curMonth()) { UI.mes = n; UI.hl = {}; UI.lcPick = null; render(); } },
  'donut-hl': el => { const id = el.dataset.id, c = el.dataset.cat; UI.hl[id] = UI.hl[id] === c ? null : c; render(); },
  'cat-filter': el => { closeSheet(); UI.x = { q: '', mes: el.dataset.mes || (el.dataset.id === 'A identificar' ? curMonth() : UI.mes), conta: '', cat: el.dataset.id || el.dataset.cat, tipo: '' }; UI.tab = 'extrato'; UI.xlim = 120; render(); window.scrollTo(0, 0); },
  'x-go': el => { closeSheet(); UI.x = { q: '', mes: el.dataset.mes || '', conta: el.dataset.conta || '', cat: '', tipo: el.dataset.tipo || '' }; UI.tab = 'extrato'; UI.xlim = 120; render(); window.scrollTo(0, 0); },
  'x-clear': () => { UI.x = { q: '', mes: '', conta: '', cat: '', tipo: '' }; render(); },
  'x-more': () => { UI.xlim += 200; render(); },
  'lc-pick': el => { UI.lcPick = +el.dataset.i; render(); },
  'rp': el => { UI.rp = el.dataset.v; render(); },
  'alerts-open': () => openAlerts(),
  'import-open': () => { closeSheet(); openImport(); },
  'imp-back': () => { IM.step = 'pick'; IM.err = ''; refreshSheet(); },
  'imp-go': () => doImport(),
  'lanc-open': el => { closeSheet(); openLanc(el.dataset.id); },
  'lanc-new': () => openNovoLanc(),
  'ld-cat': el => { LD.cat = el.dataset.cat; const g = CAT[LD.cat]; if (g && g.escopo) LD.e = g.escopo; refreshSheet(); },
  'ld-e': el => { LD.e = el.dataset.v; refreshSheet(); },
  'ld-save': () => saveLanc(),
  'ld-del': async () => { if (!await askConfirm('Excluir este lançamento?', 'Excluir')) return; tomb(LD.id); S.lanc = S.lanc.filter(x => x.id !== LD.id); await save(); closeSheet(); render(); toast('Excluído'); },
  'ld-notdup': async () => { const l = S.lanc.find(x => x.id === LD.id); if (l) l.dup = 'ok'; for (const x of S.lanc) if (x.id !== l.id && merchKey(x) === merchKey(l) && x.v === l.v && Math.abs(daysBetween(x.d, l.d)) <= 3) x.dup = 'ok'; await save(); closeSheet(); render(); toast('Certo, não é duplicada'); },
  'nd-lado': el => { ND.lado = el.dataset.v; ND.cat = el.dataset.v === 'saida' ? 'Outros' : 'Outras entradas'; refreshSheet(); },
  'nd-cat': el => { ND.cat = el.dataset.cat; const g = CAT[ND.cat]; if (g && g.escopo) ND.e = g.escopo; refreshSheet(); },
  'nd-e': el => { ND.e = el.dataset.v; refreshSheet(); },
  'nd-save': () => saveNovo(),
  'fixa-open': el => { closeSheet(); openFixa(el.dataset.id); },
  'fixa-new': () => { closeSheet(); openFixa(null); },
  'fixa-del': async el => { const f = S.fixas.find(x => x.id === el.dataset.id); if (!f) return; if (!await askConfirm(`Remover "${f.nome}" das contas fixas? O histórico no extrato continua.`, 'Remover')) return; tomb(f.id); S.fixas = S.fixas.filter(x => x.id !== f.id); await save(); closeSheet(); render(); toast('Conta fixa removida'); },
  'fd-e': el => { FD.e = el.dataset.v; refreshSheet(); },
  'fd-save': () => saveFixa(),
  'fx-pay': el => payFixa(el.dataset.m),
  'fx-unpay': async el => { const f = S.fixas.find(x => x.id === FD.id); if (!f) return; delete f.pag[el.dataset.m]; await save(); render(); closeSheet(); openFixa(f.id); },
  'desejo-new': () => { closeSheet(); openDesejo(null); },
  'desejo-open': el => openDesejo(el.dataset.id),
  'dd-save': () => saveDesejo(),
  'dd-buy': () => { const d = S.desejos.find(x => x.id === DD.id); if (!d) return; closeSheet(); openNovoLanc({ valor: NF.format(d.preco), desc: d.nome, cat: 'Compras online', desejo: d.id }); },
  'dd-quit': async () => { const d = S.desejos.find(x => x.id === DD.id); if (d) d.status = 'desistiu'; await save(); closeSheet(); render(); toast('Boa. Dinheiro preservado.'); },
  'dd-del': async () => { if (!await askConfirm('Excluir este desejo?', 'Excluir')) return; tomb(DD.id); S.desejos = S.desejos.filter(x => x.id !== DD.id); await save(); closeSheet(); render(); },
  'conta-open': el => openConta(el.dataset.id), 'conta-new': () => openConta(null),
  'cd-tipo': el => { CD.tipo = el.dataset.v; refreshSheet(); }, 'cd-e': el => { CD.escopo = el.dataset.v; refreshSheet(); }, 'cd-save': () => saveConta(),
  'invest-open': el => openInvest(el.dataset.id), 'invest-new': () => openInvest(null),
  'i2-e': el => { ID2.e = el.dataset.v; refreshSheet(); }, 'i2-save': () => saveInvest(),
  'i2-del': async () => { if (!await askConfirm('Excluir este investimento do app?', 'Excluir')) return; tomb(ID2.id); S.invest = S.invest.filter(x => x.id !== ID2.id); await save(); closeSheet(); render(); },
  'cat-new': () => openCatNew(null), 'cat-edit': el => openCatNew(el.dataset.cat),
  'cn-g': el => { openCatNew.d.grupo = el.dataset.v; refreshSheet(); },
  'cn-cor': el => { const i = $('#cn-nome'); if (i && !openCatNew.c) openCatNew.d.nome = i.value; openCatNew.d.cor = el.dataset.v; refreshSheet(); },
  'cn-save': async () => { const d = openCatNew.d, c = openCatNew.c; const i = $('#cn-nome'); if (!c) d.nome = (i.value || '').trim(); if (!d.nome) return toast('Dê um nome'); if (!c && S.categorias.find(x => x.nome === d.nome)) return toast('Já existe'); if (c) Object.assign(c, { cor: d.cor }); else S.categorias.push({ nome: d.nome, grupo: d.grupo, escopo: null, cor: d.cor }); await save(); closeSheet(); render(); },
  'cn-del': async () => { const c = openCatNew.c; if (!c) return; tomb(c.nome); S.categorias = S.categorias.filter(x => x.nome !== c.nome); await save(); closeSheet(); render(); },
  'rule-del': async el => { tomb(el.dataset.id); S.regras = S.regras.filter(r => r.id !== el.dataset.id); await save(); render(); toast('Regra apagada (os lançamentos ficam como estão)'); },
  'rev-open': el => openRevisar(el.dataset.k), 'rv-cat': el => { RV.cat = el.dataset.cat; const g = CAT[RV.cat]; if (g && g.escopo) RV.e = g.escopo; refreshSheet(); }, 'rv-e': el => { RV.e = el.dataset.v; refreshSheet(); }, 'rv-save': () => saveRevisar(),
  'ics': () => exportIcs(),
  'notif-on': () => enableNotif(),
  'export': () => exportBackup(),
  'export-csv': () => exportCsv(extratoFiltered()),
  'export-csv-all': () => exportCsv(S.lanc),
  'app-update': () => applyUpdate(), 'app-check': () => checkUpdate(true),
  'vault-setup': () => openVaultSetup(),
  'vault-sync': async () => { await Vault.sync(); toast(Vault.cfg && Vault.cfg.error ? esc(Vault.cfg.error) : 'Cofre sincronizado'); },
  'vault-versions': () => openVersions(), 'ver-restore': el => restoreVersion(el.dataset.sha), 'vault-off': () => disconnectVault(),
  'lock-forgot': () => showLock('forgot'), 'lock-mode': el => setLockMode(el.dataset.v), 'lock-bio': () => bioUnlock(false)
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  if (el.tagName !== 'A') e.preventDefault();
  const f = actions[el.dataset.act]; if (f) f(el, e);
});
const forms = { 'unlock': () => tryUnlock(), 'vault-1': () => vaultStep1(), 'vault-2': () => vaultStep2() };
document.addEventListener('submit', e => { const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault(); const fn = forms[f.dataset.form]; if (fn) fn(f); });
let xTimer = null, stTimer = null;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.x === 'q') { UI.x.q = t.value; clearTimeout(xTimer); xTimer = setTimeout(() => { const pos = t.selectionStart; render(); const i = $('#x-q'); if (i) { i.focus(); try { i.setSelectionRange(pos, pos); } catch (_) {} } }, 280); }
  if (t.dataset.ld && LD) LD[t.dataset.ld] = t.value;
  if (t.dataset.nd && ND) ND[t.dataset.nd] = t.value;
  if (t.dataset.fd && FD) FD[t.dataset.fd] = t.value;
  if (t.dataset.dd && DD) DD[t.dataset.dd] = t.value;
  if (t.dataset.cd && CD) CD[t.dataset.cd] = t.value;
  if (t.dataset.i2 && ID2) ID2[t.dataset.i2] = t.value;
  if (t.dataset.st === 'nome') { S.settings.nome = t.value.trim(); clearTimeout(stTimer); stTimer = setTimeout(() => save(), 500); }
  if (t.dataset.st === 'reservaManual') { const v = parseMoney(t.value); if (!isNaN(v)) { S.settings.reservaManual = v; clearTimeout(stTimer); stTimer = setTimeout(() => save(), 600); } }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.x && t.dataset.x !== 'q') { UI.x[t.dataset.x] = t.value; UI.xlim = 120; render(); }
  if (t.dataset.im === 'conta' && IM) { IM.conta = t.value; refreshSheet(); }
  if (t.id === 'imp-file' && t.files[0]) { await handleImportFile(t.files[0]); t.value = ''; }
  if (t.dataset.ld === 'all' && LD) LD.all = t.checked;
  if (t.dataset.fdb && FD) FD[t.dataset.fdb] = t.checked;
  if (t.dataset.cdb && CD) CD[t.dataset.cdb] = t.checked;
  if (t.dataset.i2b && ID2) ID2[t.dataset.i2b] = t.checked;
  if (t.dataset.st === 'escopo') { S.settings.escopo = t.value; UI.scope = null; await save(); }
  if (t.dataset.st === 'reservaModo') { S.settings.reservaManual = t.value === 'manual' ? (S.settings.reservaManual ?? reservaValor()) : null; await save(); render(); }
  if (t.dataset.stn) { S.settings[t.dataset.stn] = +t.value; await save(); render(); }
  if (t.id === 'lock-grace') { Lock.cfg.graceMin = +t.value; await Lock.persist(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
if (window.visualViewport) { visualViewport.addEventListener('resize', syncViewport); visualViewport.addEventListener('scroll', syncViewport); }
window.addEventListener('online', () => Vault.schedule(500));
window.addEventListener('pagehide', () => { if (!Vault.locked) Lock.touch(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { Vault.hiddenAt = Date.now(); if (!Vault.locked) Lock.touch(); return; }
  if (!Vault.locked && Lock.active() && Vault.hiddenAt && Date.now() - Vault.hiddenAt > Math.max(Lock.cfg.graceMin * 60000, 15000)) showLock(Lock.cfg.mode);
  if (Vault.cfg && Date.now() - Date.parse(Vault.cfg.lastSync || 0) > 60000) Vault.schedule(600);
  if (Date.now() - Upd.lastCheck > 30 * 60000) checkUpdate(false);
  notifyDue();
});

/* ---------- início ---------- */
(async function boot() {
  syncViewport();
  await load();
  await Vault.init();
  await Lock.init();
  if (Vault.cfg && !Vault.key) showLock('password');
  else if (Lock.active() && Lock.expired()) showLock(Lock.cfg.mode);
  render();
  if (Vault.key) Vault.schedule(1200);
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (_) {}
  if (!PREVIEW && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) navigator.serviceWorker.register('sw.js').catch(() => {});
  setTimeout(() => checkUpdate(false), 2500);
  setTimeout(() => notifyDue(), 3000);
})();
</script>
